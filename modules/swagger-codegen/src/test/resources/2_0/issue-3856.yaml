swagger: '2.0'
info:
  title: Outer enum generation (issue 3856)
  version: 1.0.0
basePath: /v1
paths:
  /orders/{orderId}/status:
    get:
      operationId: getOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/OrderStatus'
definitions:
  OrderStatus:
    type: string
    description: Status of the order
    enum:
      - placed
      - approved
      - delivered
  Order:
    type: object
    properties:
      id:
        type: integer
        format: int64
      status:
        $ref: '#/definitions/OrderStatus'