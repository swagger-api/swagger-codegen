name: Prepare Release Master

on:
  workflow_dispatch:
    branches: ["master"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: tibdex/github-app-token@v1
      id: generate-token
      with:
        app_id: ${{ secrets.APP_ID }}
        private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Set up Java 11
      uses: actions/setup-java@v5
      with:
        java-version: 11
        distribution: temurin
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - name: Cache local Maven repository
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Run prepare release script
      id: prepare-release
      run: |
        . ./CI/release/common.sh
        export MY_POM_VERSION="$(maven_project_version)"
        require_release_or_snapshot_version "MY_POM_VERSION" "${MY_POM_VERSION}"
        if [[ "${MY_POM_VERSION}" =~ SNAPSHOT$ ]]; then
          require_snapshot_version "MY_POM_VERSION" "${MY_POM_VERSION}"
          . ./CI/prepare-release.sh
          require_release_version "SC_VERSION" "${SC_VERSION}"
          require_release_version "SC_NEXT_VERSION" "${SC_NEXT_VERSION}"
          EXPECTED_SC_VERSION="$(release_from_snapshot_version "${MY_POM_VERSION}")"
          [[ "${SC_VERSION}" == "${EXPECTED_SC_VERSION}" ]] || fail "SC_VERSION (${SC_VERSION}) does not match snapshot-derived release (${EXPECTED_SC_VERSION})"
          EXPECTED_NEXT_SNAPSHOT="$(next_snapshot_from_release_version "${SC_VERSION}")"
          [[ "${MY_POM_VERSION}" == "${SC_VERSION}-SNAPSHOT" ]] || fail "MY_POM_VERSION (${MY_POM_VERSION}) is not aligned with SC_VERSION (${SC_VERSION})"
          [[ "${EXPECTED_NEXT_SNAPSHOT}" == "${SC_NEXT_VERSION}-SNAPSHOT" ]] || fail "SC_NEXT_VERSION (${SC_NEXT_VERSION}) does not match expected next snapshot (${EXPECTED_NEXT_SNAPSHOT})"
          set_output PREPARE_RELEASE_OK yes
          set_output SC_VERSION "${SC_VERSION}"
          set_output SC_NEXT_VERSION "${SC_NEXT_VERSION}"
        else
          notice "not preparing release for release version: ${MY_POM_VERSION}"
          set_output PREPARE_RELEASE_OK no
        fi
    - name: Create Prepare Release Pull Request
      uses: peter-evans/create-pull-request@v8
      if: env.PREPARE_RELEASE_OK == 'yes'
      with:
        token: ${{ steps.generate-token.outputs.token }}
        commit-message: prepare release ${{ env.SC_VERSION }}
        title: 'prepare release ${{ env.SC_VERSION }}'
        branch: prepare-release-${{ env.SC_VERSION }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS:  true
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SC_VERSION:
      SC_NEXT_VERSION:
